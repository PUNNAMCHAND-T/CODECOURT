name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-test-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/ eval/

      - name: Ruff format check
        run: ruff format --check backend/ eval/

      - name: Mypy type check
        run: mypy backend/app/ eval/

      - name: Security audit dependencies
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip -s osv

      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite+aiosqlite:///ci_test.db
        run: pytest --cov=backend/app --cov-report=term backend/tests/ -v

  frontend-audit-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Audit dependencies
        run: npm --prefix frontend audit

      - name: Build frontend
        run: npm --prefix frontend run build
