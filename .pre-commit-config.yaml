repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.10.5
          - pydantic-settings==2.7.1
          - fastapi==0.115.6
          - sqlalchemy==2.0.36
        pass_filenames: false
        args: [backend/]
